# Only the API service. The database is Neon (DATABASE_URL in .env) - never add a DB container here.
services:
  api:
    build: .
    image: rag-platform-api:dev
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
