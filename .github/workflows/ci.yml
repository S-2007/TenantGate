name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff==0.13.3"   # same version as requirements.lock
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 120  # ~50 min before Phase 6 (Neon round trips dominate); Phase 6 adds upload tests + the dynamic-tenant suite
    # Fork PRs cannot read secrets, so they cannot create a Neon branch. Skip instead of failing.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      ENV: ci
      CI: "true"
      LLM_PROVIDER: fake          # deterministic, no API key, no cost
      EMBEDDING_MODEL: hash       # offline embeddings
      EMBEDDING_DIM: "384"
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -c requirements.lock torch
          pip install -e ".[dev]" -c requirements.lock   # exact versions the suite passed with

      - name: Unit tests (no database)
        run: python -m pytest -q tests/unit

      - name: Create throwaway Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          parent_branch: dev          # never branch CI from production data
          database: neondb
          role: neondb_owner          # dev has several roles; name the owner explicitly

      - name: Export test connection strings
        run: |
          echo "::add-mask::${{ steps.neon.outputs.password }}"
          jwt="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$jwt"
          {
            echo "TEST_DATABASE_URL=${{ steps.neon.outputs.db_url_pooled }}"
            echo "TEST_DATABASE_URL_DIRECT=${{ steps.neon.outputs.db_url }}"
            echo "JWT_SECRET=$jwt"
          } >> "$GITHUB_ENV"

      - name: Reset branch schema (prove migrations apply on an empty database)
        run: python -m scripts.reset_test_schema --yes

      - name: Migrate
        run: python -m alembic -x db=test upgrade head

      - name: Integration tests (Neon)
        run: python -m pytest -q -rs tests/integration

      - name: Security suite (adversarial leakage + mutation meta-tests)
        run: python -m pytest -q -rs -s tests/security

      - name: ACL integrity gate (no chunk may drift from its document)
        run: python -m scripts.reconcile_acls --test

      - name: Publish leak report
        if: always()
        run: |
          if [ -f tests/security/REPORT.md ]; then cat tests/security/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload leak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            tests/security/report.json
            tests/security/REPORT.md
          if-no-files-found: ignore

      - name: Delete Neon branch
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}
