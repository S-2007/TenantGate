[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform"
version = "0.1.0"
description = "Permission-aware multi-tenant RAG service on Neon Postgres + pgvector"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.40",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary,pool]>=3.2,<3.4",
    "pgvector>=0.3.2,<0.5",
    "pyjwt>=2.8,<3",
    "argon2-cffi>=23.1,<26",
    "python-multipart>=0.0.9,<0.1",
    "httpx>=0.27,<0.29",
    "sentence-transformers>=3.0,<6",
    "groq>=0.11,<2",
    "google-genai>=3,<4",
    "pypdf>=6.0,<7",  # Phase 6: PDF text extraction (pure Python)
    "python-docx>=1.1,<2",  # Phase 6: .docx text extraction
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1.2",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<0.14",
]

[tool.setuptools.packages.find]
include = ["app*", "eval*", "scripts*"]

[tool.setuptools.package-data]
app = ["web/*"]  # the static web UI (HTML/CSS/JS)

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "eval/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W"]
ignore = ["S101", "E501"]  # asserts ok; line length is owned by `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
# migrations are static DDL built from module constants (no runtime input reaches them)
"migrations/**" = ["E501", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "neon: requires a Neon TEST branch (TEST_DATABASE_URL); skipped locally if unset, required in CI",
    "slow: loads the real embedding model",
    "security: adversarial leakage suite (tests/security), Neon-backed",
]
asyncio_default_fixture_loop_scope = "function"
